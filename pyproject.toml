[project]
name = "fa-sarima-pmc"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandera[polars]>=0.35.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsforecast>=2.1.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "papermill>=2.7.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 88  # Black's default; `ruff format` is Black-compatible
target-version = "py313"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP"]
ignore = ["N805"]  # pandera @pa.check methods take `cls` without @classmethod

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]  # imports in later notebook cells are normal
